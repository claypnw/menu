<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning reporting — process flow chart</title>
<style>
  body { font-family: Georgia, serif; background:#fffdf5; color:#111; margin:0; padding:1rem; }
  h1 { font-size:1.3rem; }
  .bar { margin:.5rem 0 1rem; }
  button { font-size:1rem; padding:.35rem .8rem; margin-right:.4rem; }
  #wrap { overflow:auto; border:1px solid #8a6d3b; background:#fff; }
  svg { display:block; }
  text { font-family: Georgia, serif; }
</style>
</head>
<body>
<h1>Morning reporting — process flow chart (production document, 2026-10-31)</h1>
<div class="bar">
  <button onclick="zoom(0.8)">Zoom out</button>
  <button onclick="zoom(1.25)">Zoom in</button>
  <button onclick="zoom(0)">Reset</button>
</div>
<div id="wrap">
<svg id="chart" width="900" height="1560" viewBox="0 0 900 1560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <g id="zoomg">
  <!-- START terminator -->
  <rect x="300" y="20" width="300" height="52" rx="26" fill="#e8f0e8" stroke="#111"/>
  <text x="450" y="42" text-anchor="middle" font-size="15">START — the night's jobs run</text>
  <text x="450" y="62" text-anchor="middle" font-size="12">(each writes its verify log and its finish or error line)</text>

  <line x1="450" y1="72" x2="450" y2="100" stroke="#111" marker-end="url(#arr)"/>

  <!-- step: morning check -->
  <rect x="250" y="100" width="400" height="56" fill="#fff" stroke="#111"/>
  <text x="450" y="122" text-anchor="middle" font-size="14">05:00 — morning check builds the KPI page</text>
  <text x="450" y="142" text-anchor="middle" font-size="12">and the night record (finished / failed / no record)</text>

  <line x1="450" y1="156" x2="450" y2="184" stroke="#111" marker-end="url(#arr)"/>

  <!-- step: menu job collects -->
  <rect x="250" y="184" width="400" height="56" fill="#fff" stroke="#111"/>
  <text x="450" y="206" text-anchor="middle" font-size="14">05:20 — morning-menu job collects each item's</text>
  <text x="450" y="226" text-anchor="middle" font-size="12">report file and its status, from the named records</text>

  <line x1="450" y1="240" x2="450" y2="268" stroke="#111" marker-end="url(#arr)"/>

  <!-- diamond: file missing? -->
  <polygon points="450,268 640,318 450,368 260,318" fill="#fdf6e0" stroke="#111"/>
  <text x="450" y="312" text-anchor="middle" font-size="14">A report file</text>
  <text x="450" y="332" text-anchor="middle" font-size="14">missing?</text>
  <!-- yes branch right -->
  <line x1="640" y1="318" x2="730" y2="318" stroke="#111" marker-end="url(#arr)"/>
  <text x="672" y="308" font-size="13">Yes</text>
  <rect x="730" y="282" width="160" height="72" fill="#fff" stroke="#111"/>
  <text x="810" y="304" text-anchor="middle" font-size="12">Item left off the</text>
  <text x="810" y="320" text-anchor="middle" font-size="12">menu; its absence is</text>
  <text x="810" y="336" text-anchor="middle" font-size="12">named in the handoff</text>
  <path d="M810,354 L810,404 L450,404" fill="none" stroke="#111" marker-end="url(#arr)"/>
  <text x="450" y="392" text-anchor="middle" font-size="13">No</text>
  <line x1="450" y1="368" x2="450" y2="404" stroke="#111"/>

  <!-- step: decisions -->
  <rect x="250" y="404" width="400" height="56" fill="#fff" stroke="#111"/>
  <text x="450" y="426" text-anchor="middle" font-size="14">Collect pending decisions from</text>
  <text x="450" y="446" text-anchor="middle" font-size="14">the completion pile</text>

  <line x1="450" y1="460" x2="450" y2="488" stroke="#111" marker-end="url(#arr)"/>

  <!-- step: menu record -->
  <rect x="250" y="488" width="400" height="56" fill="#fff" stroke="#111"/>
  <text x="450" y="510" text-anchor="middle" font-size="14">Write the dated menu record</text>
  <text x="450" y="530" text-anchor="middle" font-size="12">(morning-menu-&lt;date&gt;.json — items, statuses, links, decisions)</text>

  <line x1="450" y1="544" x2="450" y2="572" stroke="#111" marker-end="url(#arr)"/>

  <!-- step: builder -->
  <rect x="250" y="572" width="400" height="56" fill="#fff" stroke="#111"/>
  <text x="450" y="594" text-anchor="middle" font-size="14">build_morning_menu.py renders the page</text>
  <text x="450" y="614" text-anchor="middle" font-size="12">and gathers the report copies</text>

  <line x1="450" y1="628" x2="450" y2="656" stroke="#111" marker-end="url(#arr)"/>

  <!-- diamond: builder PASS? -->
  <polygon points="450,656 620,706 450,756 280,706" fill="#fdf6e0" stroke="#111"/>
  <text x="450" y="700" text-anchor="middle" font-size="14">Builder ends</text>
  <text x="450" y="720" text-anchor="middle" font-size="14">VERDICT: PASS?</text>
  <!-- no branch left -->
  <line x1="280" y1="706" x2="170" y2="706" stroke="#111" marker-end="url(#arr)"/>
  <text x="205" y="696" font-size="13">No</text>
  <rect x="10" y="670" width="160" height="72" fill="#fdecec" stroke="#111"/>
  <text x="90" y="692" text-anchor="middle" font-size="12">Error line written;</text>
  <text x="90" y="708" text-anchor="middle" font-size="12">no page published;</text>
  <text x="90" y="724" text-anchor="middle" font-size="12">record set aside</text>
  <path d="M90,742 L90,1470 L368,1470" fill="none" stroke="#111" marker-end="url(#arr)"/>
  <text x="450" y="772" text-anchor="middle" font-size="13">Yes</text>
  <line x1="450" y1="756" x2="450" y2="790" stroke="#111"/>

  <!-- step: publish -->
  <rect x="250" y="790" width="400" height="64" fill="#fff" stroke="#111"/>
  <text x="450" y="812" text-anchor="middle" font-size="14">Publish to claypnw/menu: morning.html,</text>
  <text x="450" y="830" text-anchor="middle" font-size="14">morning-&lt;date&gt;.html, morning-files/ copies</text>
  <text x="450" y="848" text-anchor="middle" font-size="12">(GitHub key program — no browser)</text>

  <line x1="450" y1="854" x2="450" y2="882" stroke="#111" marker-end="url(#arr)"/>

  <!-- step: finish line -->
  <rect x="250" y="882" width="400" height="56" fill="#fff" stroke="#111"/>
  <text x="450" y="904" text-anchor="middle" font-size="14">Finish line written, resting on</text>
  <text x="450" y="924" text-anchor="middle" font-size="14">the menu record</text>

  <line x1="450" y1="938" x2="450" y2="966" stroke="#111" marker-end="url(#arr)"/>

  <!-- step: chat message -->
  <rect x="250" y="966" width="400" height="64" fill="#eef2fb" stroke="#111"/>
  <text x="450" y="988" text-anchor="middle" font-size="14">One chat message: one line + the page link;</text>
  <text x="450" y="1006" text-anchor="middle" font-size="14">decision buttons under the link</text>
  <text x="450" y="1024" text-anchor="middle" font-size="12">(menu items never get chat buttons)</text>

  <line x1="450" y1="1030" x2="450" y2="1058" stroke="#111" marker-end="url(#arr)"/>

  <!-- step: Clay taps -->
  <rect x="250" y="1058" width="400" height="64" fill="#eef2fb" stroke="#111"/>
  <text x="450" y="1080" text-anchor="middle" font-size="14">Clay opens the page any time, taps any row</text>
  <text x="450" y="1098" text-anchor="middle" font-size="14">in any order — each row opens that item's</text>
  <text x="450" y="1116" text-anchor="middle" font-size="14">own separate report</text>

  <line x1="450" y1="1122" x2="450" y2="1444" stroke="#111" marker-end="url(#arr)"/>

  <!-- side branch: alarms (connector A) -->
  <circle cx="120" cy="240" r="13" fill="#fff" stroke="#111"/>
  <text x="120" y="245" text-anchor="middle" font-size="13">A</text>
  <rect x="10" y="262" width="220" height="76" fill="#fdecec" stroke="#111"/>
  <text x="120" y="284" text-anchor="middle" font-size="12">Money alarms, and dangers to</text>
  <text x="120" y="300" text-anchor="middle" font-size="12">the house, the cats, or people,</text>
  <text x="120" y="316" text-anchor="middle" font-size="12">go as their own message at once</text>
  <text x="120" y="332" text-anchor="middle" font-size="12">— they never wait for the menu</text>
  <path d="M120,338 L120,994 L242,994" fill="none" stroke="#111"/>
  <circle cx="120" cy="994" r="13" fill="#fff" stroke="#111"/>
  <text x="120" y="999" text-anchor="middle" font-size="13">A</text>

  <!-- STOP terminator: the one stop -->
  <rect x="300" y="1444" width="300" height="52" rx="26" fill="#e8f0e8" stroke="#111"/>
  <text x="450" y="1466" text-anchor="middle" font-size="15">STOP — the morning's reporting</text>
  <text x="450" y="1486" text-anchor="middle" font-size="15">stands delivered</text>
  </g>
</svg>
</div>
<script>
  let scale = 1;
  function zoom(f) {
    scale = (f === 0) ? 1 : Math.min(2.5, Math.max(0.4, scale * f));
    document.getElementById('zoomg').setAttribute('transform', 'scale(' + scale + ')');
  }
</script>
</body>
</html>
