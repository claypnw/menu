<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #241a12; --paper: #f3eee3; --ink: #211e19; --muted: #6b6257;
    --wood: #542d1b; --wood-deep: #2f1a12; --ember: #b54f24; --gold: #e8b64c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(120% 90% at 50% 0%, #3a2a1c 0%, var(--bg) 60%, #180f09 100%);
    color: var(--paper); font-family: "Source Sans 3", "Trebuchet MS", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 24px 20px 28px; justify-content: center;
  }
  h1 {
    font-family: "Alegreya SC", Georgia, serif; font-size: 1.7rem; margin: 0 0 2px;
    color: var(--gold); letter-spacing: 1px; text-align: center;
  }
  .sub { color: #c9bda9; margin: 0 0 18px; text-align: center; font-size: .95rem; }
  nav { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 10px; }
  a.btn {
    display: block; text-decoration: none; color: var(--ink);
    background: linear-gradient(180deg, #f7f1e4, #e9dfc9);
    border: 2px solid #8f8068; border-radius: 10px;
    padding: 12px 18px; box-shadow: 0 8px 22px rgba(0,0,0,.45);
  }
  a.btn:active { transform: translateY(2px); box-shadow: 0 4px 12px rgba(0,0,0,.45); }
  a.btn .t { display: block; font-size: 1.15rem; font-weight: 700; font-family: "Alegreya SC", Georgia, serif; color: var(--wood-deep); }
  a.btn .d { display: block; margin-top: 2px; color: var(--muted); font-size: .88rem; }
  footer { margin-top: 20px; color: #8a7c68; font-size: .78rem; text-align: center; }
</style>
</head>
<body>
  <h1>Menu</h1>
  <p class="sub">Your doors to everything</p>
  <nav>
    <a class="btn" href="https://claypnw.github.io/morning-scroll/">
      <span class="t">Morning Scroll</span><span class="d">Today&rsquo;s paper</span>
    </a>
    <a class="btn" href="https://claypnw.github.io/morning-scroll/yard-sales.html">
      <span class="t">Yard &amp; Estate Sales</span><span class="d">This week&rsquo;s sheet</span>
    </a>
    <a class="btn" href="https://claypnw.github.io/gilded-pages/">
      <span class="t">Gilded Pages</span><span class="d">Business directory</span>
    </a>
    <a class="btn" href="https://claypnw.github.io/mogollon-s-hearth-build-page/">
      <span class="t">Mogollon&rsquo;s Hearth</span><span class="d">Build page &amp; prop inventory</span>
    </a>
  </nav>
  <footer>Made for the Hearth &middot; opens in your browser, no apps needed</footer>
</body>
</html>
