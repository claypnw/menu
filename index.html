<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Menu — Mogollon's Hearth</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #241a12; --paper: #f3eee3; --ink: #211e19; --muted: #6b6257;
    --wood: #542d1b; --wood-deep: #2f1a12; --ember: #b54f24; --gold: #e8b64c;
    --line: #8f8068;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(120% 90% at 50% 0%, #3a2a1c 0%, var(--bg) 60%, #180f09 100%);
    color: var(--paper); font-family: "Source Sans 3", "Trebuchet MS", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 28px 20px 24px;
  }
  .sheet {
    width: 100%; max-width: 920px; display: grid; grid-template-columns: 1fr 1fr;
    background: var(--paper); border: 2px solid var(--line); border-radius: 14px;
    overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.5);
  }
  .art { min-height: 100%; }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .doors { padding: 30px 30px 26px; color: var(--ink); }
  .kicker {
    font-family: "Alegreya SC", Georgia, serif; font-size: .95rem; letter-spacing: 3px;
    color: var(--ember); margin: 0 0 4px;
  }
  h1 {
    font-family: "Alegreya SC", Georgia, serif; font-size: 2.4rem; margin: 0;
    color: var(--wood-deep); line-height: 1.1;
  }
  .rule { border: none; border-top: 2px solid var(--gold); margin: 12px 0 10px; width: 72px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 1rem; }
  nav { display: flex; flex-direction: column; gap: 10px; }
  a.btn {
    display: block; text-decoration: none; color: var(--ink);
    background: linear-gradient(180deg, #f7f1e4, #e9dfc9);
    border: 2px solid var(--line); border-radius: 10px;
    padding: 12px 18px; box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  a.btn:active { transform: translateY(2px); box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  a.btn .t { display: block; font-size: 1.2rem; font-weight: 700; font-family: "Alegreya SC", Georgia, serif; color: var(--wood-deep); }
  a.btn .d { display: block; margin-top: 2px; color: var(--muted); font-size: .9rem; }
  footer { margin-top: 18px; color: #8a7c68; font-size: .8rem; text-align: center; max-width: 920px; }
  @media (max-width: 700px) {
    .sheet { grid-template-columns: 1fr; }
    .art img { height: 210px; }
    .doors { padding: 22px 20px; }
    h1 { font-size: 2rem; }
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="art"><img src="hearth-hero.jpg" alt="The stone hearth of Mogollon's Hearth, fire lit" /></div>
    <div class="doors">
      <p class="kicker">Mogollon's Hearth</p>
      <h1>Menu</h1>
      <hr class="rule" />
      <p class="sub">Your doors to everything</p>
      <nav>
        <a class="btn" href="https://claypnw.github.io/morning-scroll/">
          <span class="t">Morning Scroll</span><span class="d">Today&rsquo;s paper</span>
        </a>
        <a class="btn" href="https://claypnw.github.io/morning-scroll/yard-sales.html">
          <span class="t">Yard &amp; Estate Sales</span><span class="d">This week&rsquo;s sheet</span>
        </a>
        <a class="btn" href="https://claypnw.github.io/gilded-pages/">
          <span class="t">Gilded Pages</span><span class="d">Business directory</span>
        </a>
        <a class="btn" href="https://claypnw.github.io/mogollon-s-hearth-build-page/">
          <span class="t">Mogollon&rsquo;s Hearth</span><span class="d">Build page &amp; prop inventory</span>
        </a>
      </nav>
    </div>
  </div>
  <footer>Where the Rim touches the Sky &middot; opens in your browser, no apps needed</footer>
</body>
</html>
