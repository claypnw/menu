<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hourly Status Report — Mogollon's Hearth</title>
<style>
  body { margin: 0; background: #f3ecd9; color: #2b2418; font-family: Georgia, serif; }
  .sheet { max-width: 900px; margin: 0 auto; padding: 20px 16px 32px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.when { margin: 0 0 16px; color: #5a4d33; }
  img.report { width: 100%; height: auto; border: 1px solid #cbbfa0; background: #fffdf4; }
  p.pdf { margin-top: 16px; font-size: 1.05rem; }
  a { color: #6b4f1d; }
</style>
</head>
<body>
  <div class="sheet">
    <h1>Hourly Status Report</h1>
    <p class="when">Tuesday, October 27, 2026 — 9:00 PM Arizona time — a new report stands here on the hour. This page always shows the latest one.</p>
    <img class="report" src="hourly-status.png" alt="The latest hourly status report page" />
    <p class="pdf"><a href="hourly-status.pdf">Open the report as a PDF</a></p>
  </div>
</body>
</html>
